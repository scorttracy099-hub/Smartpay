
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartPay - Smart Payments</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f6fb;
      color: #172554;
    }

    header {
      background: #102c54;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 7px;
      color: #cbd5e1;
    }

    main {
      max-width: 500px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000010;
    }

    h2 {
      margin-bottom: 12px;
    }

    p {
      line-height: 1.6;
    }

    .status {
      margin-top: 25px;
      padding: 15px;
      background: #e0f2fe;
      border-radius: 10px;
      color: #075985;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <h1>SmartPay</h1>
    <p>Simple. Fast. Smart Payments.</p>
  </header>

  <main>
    <div class="card">
      <h2>Welcome to SmartPay</h2>

      <p>
        A smarter way for shops and customers
        to make payments.
      </p>

      <div class="status">
        <strong>System status:</strong>
        Development in progress.
      </div>
    </div>
  </main>

  <footer>
    SmartPay © 2026
  </footer>

</body>
</html>
